<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">低素材学生简历挖掘案例封面</title>
  <desc id="desc">Cover image for a low-material resume mining case.</desc>
  <rect width="1200" height="675" fill="#f5f7fb"/>
  <rect x="72" y="72" width="1056" height="531" rx="22" fill="#ffffff" stroke="#d9e0ee"/>
  <text x="120" y="160" font-family="Arial, sans-serif" font-size="54" font-weight="700" fill="#1f2937">低素材学生也能挖出证据链</text>
  <text x="120" y="222" font-family="Arial, sans-serif" font-size="28" fill="#526173">没实习 / 没竞赛 / 没项目，不等于没价值</text>
  <g font-family="Arial, sans-serif" font-size="30" font-weight="700">
    <rect x="120" y="300" width="220" height="74" rx="12" fill="#eef2ff"/>
