    <rect x="870" y="300" width="220" height="74" rx="12" fill="#fdf2f8"/>
    <text x="898" y="348" fill="#be185d">团队信任</text>
  </g>
  <path d="M180 462H1020" stroke="#1f2937" stroke-width="4" stroke-linecap="round"/>
  <path d="M1002 446L1024 462L1002 478" fill="none" stroke="#1f2937" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="120" y="538" font-family="Arial, sans-serif" font-size="32" fill="#111827">小经历 → 具体动作 → 受益对象 → 企业价值</text>
