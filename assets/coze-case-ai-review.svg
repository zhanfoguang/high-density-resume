<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">AI 修改建议审查案例封面</title>
  <desc id="desc">Cover image for reviewing another AI's resume suggestions.</desc>
  <rect width="1200" height="675" fill="#fff7ed"/>
  <rect x="72" y="72" width="1056" height="531" rx="22" fill="#ffffff" stroke="#fed7aa"/>
  <text x="120" y="158" font-family="Arial, sans-serif" font-size="52" font-weight="700" fill="#7c2d12">别让 AI 把简历改虚</text>
  <text x="120" y="218" font-family="Arial, sans-serif" font-size="28" fill="#9a3412">采纳 / 驳回 / 部分采纳 / 需补事实</text>
  <g font-family="Arial, sans-serif" font-size="30" font-weight="700">
    <rect x="120" y="292" width="220" height="78" rx="12" fill="#dcfce7"/>
    <text x="176" y="342" fill="#166534">采纳</text>
    <rect x="370" y="292" width="220" height="78" rx="12" fill="#fee2e2"/>
    <text x="426" y="342" fill="#991b1b">驳回</text>
    <rect x="620" y="292" width="220" height="78" rx="12" fill="#fef3c7"/>
    <text x="656" y="342" fill="#92400e">部分采纳</text>
    <rect x="870" y="292" width="220" height="78" rx="12" fill="#e0f2fe"/>
    <text x="906" y="342" fill="#075985">需补事实</text>
  </g>
  <text x="120" y="480" font-family="Arial, sans-serif" font-size="34" fill="#431407">真实性、个人识别度、HR 搜索率、面试风险</text>
  <text x="120" y="536" font-family="Arial, sans-serif" font-size="26" fill="#9a3412">逐条裁决，不默认全盘采纳</text>
</svg>
