id: resume-evidence-matcher
name: Resume Evidence Matcher
version: 1.0.0
author: zhanfoguang
license: MIT
homepage: https://github.com/zhanfoguang/high-density-resume
source: https://github.com/zhanfoguang/high-density-resume
category: career
tags:
  - resume
  - job-description
  - job-matching
  - career
  - interview
  - evidence
  - skill-gap
  - resume-tailoring
  - evidence-selection
languages:
  - zh
  - en
agents:
  - SKILL.md-compatible agents
entrypoint: SKILL.md
description: >
  Compare a plain-text or Markdown resume with a specific job description,
  map every requirement to traceable evidence, calculate deterministic evidence
  coverage, rank evidence for limited resume space, and produce a targeted resume,
  interview storyline, gaps, and minimum proof-building tasks.
requirements:
  python: ">=3.10"
  third_party_dependencies: []
privacy:
  data_processing: local
  network_required: false
  stores_user_data: false
